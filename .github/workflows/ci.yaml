name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.23"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Tests (race)
        run: go test -race ./...
      - name: Validate examples
        run: go run ./cmd/pgy validate --schema-root examples

  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tests
        run: go test ./...
      - name: Validate examples
        run: go run ./cmd/pgy validate --schema-root examples

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17", "18", "19"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: pgy
          POSTGRES_PASSWORD: pgy
          POSTGRES_DB: pgytest
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pgy -d pgytest"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install the PL/Perl, PL/Python and PL/Tcl runtimes
        run: |
          docker exec ${{ job.services.postgres.id }} apk add --no-cache perl python3 tcl
          # plperl.so needs libperl.so, which alpine's perl installs only under core_perl/CORE
          docker exec ${{ job.services.postgres.id }} ln -sf /usr/lib/perl5/core_perl/CORE/libperl.so /usr/lib/libperl.so
      - name: Integration tests (PostgreSQL ${{ matrix.postgres }})
        env:
          PGY_TEST_DSN: postgres://pgy:pgy@localhost:5433/pgytest
          PGY_TEST_REQUIRE_PL: "1"
          # the service container's own pg_dump, which matches the server version
          PGY_TEST_PGDUMP: docker exec -e PGPASSWORD=pgy ${{ job.services.postgres.id }} pg_dump -h localhost -U pgy
        run: go test -count=1 ./internal/cli/... ./internal/integration/...
