# Module: setting — key/value application settings.
# Standalone: no other module required.
schema public:
  function set_updated_at():
    returns: trigger
    language: plpgsql
    volatile: true
    body: |
      BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
      END;

  table setting:
    comment: "Application-wide key/value settings."
    columns:
      key:
        type: text
        primaryKey: true
      value:
        type: jsonb
        notNull: true
      description:
        type: text
        nullable: true
      updated_at:
        type: timestamptz
        notNull: true
        default: now()
    triggers:
      set_updated_at:
        timing: before
        events: [update]
        level: row
        procedure: public.set_updated_at()
    dependsOn:
      - function public.set_updated_at
