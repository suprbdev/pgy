# Link: cart_item → product.
# Requires: modules/commerce/cart.yml, modules/commerce/product.yml.
schema public:
  table cart_item:
    columns:
      product_id:
        type: uuid
        notNull: true
    foreignKeys:
      cart_item_product_id_fkey:
        columns: [product_id]
        references:
          table: public.product
          columns: [id]
        onDelete: cascade
    indexes:
      cart_item_product_id_idx:
        columns: [product_id]
    dependsOn:
      - table public.product
